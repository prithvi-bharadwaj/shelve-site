<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shelve — sorry to see you go</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<style>
  :root { --bg:#faf9f6; --ink:#1c1b18; --muted:#6f6b62; --line:#e6e2d9; --accent:#a16207; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: "Geist", -apple-system, "Segoe UI", sans-serif; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 0 24px 64px; }
  header { padding: 28px 0 48px; }
  .mark { font-weight: 600; font-size: 17px; color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 9px; }
  .mark img { width: 22px; height: 22px; }
  h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
  .sub { margin-top: 10px; color: var(--muted); font-size: 15px; }
  .reasons { margin-top: 28px; display: flex; flex-direction: column; gap: 10px; }
  .reasons button {
    text-align: left; padding: 13px 16px; font: inherit; font-size: 15px; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
  }
  .reasons button:hover { border-color: var(--ink); }
  .thanks { display: none; margin-top: 28px; font-size: 15px; }
  .thanks a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header><a class="mark" href="index.html"><img src="assets/favicon.svg" alt="">Shelve</a></header>
  <h1>Shelve was uninstalled. One question?</h1>
  <p class="sub">One click, anonymous, no follow-up. It genuinely shapes what gets fixed next.</p>

  <div class="reasons" id="reasons">
    <button data-reason="api_key">Needed an API key — too much setup</button>
    <button data-reason="bad_groups">The groups it made weren’t right</button>
    <button data-reason="chrome_native">Chrome’s built-in grouping is enough for me</button>
    <button data-reason="broke">Something broke or didn’t work</button>
    <button data-reason="cleanup">Just clearing out extensions</button>
    <button data-reason="curious">Was only having a look</button>
  </div>

  <p class="thanks" id="thanks">Thank you — that helps more than you’d think. If you have 30 more seconds, <a href="mailto:prithvi@skive.in?subject=Why%20I%20uninstalled%20Shelve">tell me what would have kept you</a>.</p>

<script>
  document.getElementById("reasons").addEventListener("click", (e) => {
    const reason = e.target?.dataset?.reason;
    if (!reason) return;
    fetch("/api/feedback", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ reason }),
    }).catch(() => undefined);
    document.getElementById("reasons").style.display = "none";
    document.getElementById("thanks").style.display = "block";
  });
</script>
</div>
</body>
</html>
